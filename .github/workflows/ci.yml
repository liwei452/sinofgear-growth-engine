name: CI

on:
  push:
    branches: [feature/phase-a, master, main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check apps integrations config
      - name: Run tests
        run: python -m pytest -q
      - name: Django system check
        run: python manage.py check --settings=config.test_settings
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --settings=config.test_settings --validate

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies for API contract
        run: pip install ".[dev]"
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: API contract check
        run: pnpm api:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm build

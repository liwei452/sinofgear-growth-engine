name: Director PostgreSQL concurrency

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-b1-lead-intelligence
  pull_request:
    branches:
      - feature/phase-b1-lead-intelligence

jobs:
  director-concurrency:
    runs-on: ubuntu-latest
    env:
      DIRECTOR_TEST_DATABASE_URL: postgresql://director_test:director_test@127.0.0.1:5432/director_test
      DJANGO_SETTINGS_MODULE: config.postgres_test_settings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: director_test
          POSTGRES_USER: director_test
          POSTGRES_PASSWORD: director_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U director_test -d director_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Run Director PostgreSQL concurrency tests
        working-directory: backend
        run: python -m pytest apps/director/tests/test_concurrency_postgres.py -q
